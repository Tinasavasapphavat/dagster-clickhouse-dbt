name: Dagster CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "dagster_dbt_project/**"
      - "docker-compose.yml"
      - "Dockerfile"
      - "workspace.yaml"
      - "dagster.yaml"
      - "README.md"
  pull_request:
    branches:
      - main
    paths:
      - "dagster_dbt_project/**"
      - "docker-compose.yml"
      - "Dockerfile"
      - "workspace.yaml"
      - "dagster.yaml"
      - "README.md"
jobs:
  test:
    name: Test Dagster
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install dagster dagster-dbt dagster-webserver dbt-clickhouse

      - name: Validate Python syntax
        run: |
          python -c "
          import ast
          with open('dagster_dbt_project/__init__.py', 'r') as f:
              source = f.read()
          ast.parse(source)
          print('Syntax valid!')
          "

      - name: Validate docker-compose
        run: docker compose config

  deploy:
    name: Deploy Dagster (Zero Downtime)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DAGSTER_EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.DAGSTER_EC2_SSH_KEY }}
          script: |
            cd ~/clickhouse-dbt
            git pull origin main
            cd clickhouse_dbt
            dbt compile --profiles-dir ~/.dbt
            cd ..
            docker compose build --no-cache
            docker compose up -d --no-deps dagster_daemon
            sleep 10
            docker compose up -d --no-deps dagster_webserver
            docker compose ps